<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sana Tower | Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f6f8;color:#222}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0000000d;margin-bottom:18px}h1,h2{margin-top:0}.login{max-width:420px;margin:70px auto}input,select,textarea,button{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin:6px 0;font:inherit}button{background:#111;color:#fff;cursor:pointer}.danger{background:#b42318}.muted{color:#777}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top button{width:auto;padding:9px 16px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.actions{display:flex;gap:6px}.actions button{width:auto;padding:7px 10px;margin:0}.status{font-weight:bold}.msg{padding:10px;border-radius:8px;background:#fff3cd;margin:8px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}
</style>
</head>
<body>
<div id="loginView" class="wrap"><div class="card login"><h1>لوحة تحكم Sana Tower</h1><p class="muted">دخول المدير</p><form id="loginForm"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" required><button>تسجيل الدخول</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="wrap hidden">
<div class="top"><div><h1>لوحة التحكم</h1><p class="muted">إدارة العملاء والوحدات</p></div><button id="logout">تسجيل الخروج</button></div>
<div class="card"><h2>العملاء Leads</h2><div id="leadMsg"></div><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>البريد</th><th>الوحدة</th><th>الحالة</th><th>التاريخ</th><th></th></tr></thead><tbody id="leadsBody"></tbody></table></div>
<div class="card"><h2>إضافة وحدة</h2><form id="unitForm" class="grid"><input name="code" placeholder="كود الوحدة" required><select name="type" required><option value="Commercial">تجاري</option><option value="Residential">سكني</option><option value="Hotel">فندقي</option></select><input name="title" placeholder="اسم الوحدة" required><input name="floor" placeholder="الدور"><input name="area" type="number" min="0" placeholder="المساحة"><input name="price" type="number" min="0" placeholder="السعر"><select name="status"><option value="available">متاحة</option><option value="reserved">محجوزة</option><option value="sold">مباعة</option></select><input name="view" placeholder="الإطلالة"><input name="description" placeholder="الوصف"><button type="submit">إضافة الوحدة</button></form><div id="unitMsg"></div></div>
<div class="card"><h2>الوحدات</h2><table><thead><tr><th>الكود</th><th>الاسم</th><th>النوع</th><th>المساحة</th><th>السعر</th><th>الحالة</th><th></th></tr></thead><tbody id="unitsBody"></tbody></table></div>
</div>
<script>
const API=window.SANA_API_URL||location.origin+'/api'; let token=localStorage.getItem('sana_admin_token');
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(API+path,opt);const d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error('انتهت الجلسة')}if(!r.ok)throw Error(d.message||'حدث خطأ');return d}
function logout(){localStorage.removeItem('sana_admin_token');token=null;$('app').classList.add('hidden');$('loginView').classList.remove('hidden')}
$('logout').onclick=logout;
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='جاري الدخول...';try{const d=await api('/auth/login',{method:'POST',body:{email:$('email').value,password:$('password').value}});token=d.token;localStorage.setItem('sana_admin_token',token);showApp()}catch(err){$('loginMsg').textContent=err.message}};
async function showApp(){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');await Promise.all([loadLeads(),loadUnits()])}
async function loadLeads(){const d=await api('/leads?limit=100');$('leadsBody').innerHTML=d.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${esc(x.unitType)}</td><td><select onchange="changeLead('${x._id}',this.value)"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='contacted'?'selected':''}>contacted</option><option ${x.status==='qualified'?'selected':''}>qualified</option><option ${x.status==='closed'?'selected':''}>closed</option></select></td><td>${new Date(x.createdAt).toLocaleDateString('ar-EG')}</td><td><button class="danger" onclick="deleteLead('${x._id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="7">لا يوجد عملاء حتى الآن</td></tr>'}
async function changeLead(id,status){try{await api('/leads/'+id,{method:'PATCH',body:{status}});$('leadMsg').textContent='تم تحديث حالة العميل';setTimeout(()=>$('leadMsg').textContent='',2000)}catch(e){alert(e.message)}}
async function deleteLead(id){if(!confirm('هل تريد حذف العميل؟'))return;try{await api('/leads/'+id,{method:'DELETE'});loadLeads()}catch(e){alert(e.message)}}
async function loadUnits(){const d=await api('/units');$('unitsBody').innerHTML=d.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.title)}</td><td>${esc(x.type)}</td><td>${esc(x.area)}</td><td>${esc(x.price)}</td><td><select onchange="changeUnit('${x._id}',this.value)"><option value="available" ${x.status==='available'?'selected':''}>متاحة</option><option value="reserved" ${x.status==='reserved'?'selected':''}>محجوزة</option><option value="sold" ${x.status==='sold'?'selected':''}>مباعة</option></select></td><td><button class="danger" onclick="deleteUnit('${x._id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="7">لا توجد وحدات</td></tr>'}
async function changeUnit(id,status){try{await api('/units/'+id,{method:'PATCH',body:{status}})}catch(e){alert(e.message)}}
async function deleteUnit(id){if(!confirm('هل تريد حذف الوحدة؟'))return;try{await api('/units/'+id,{method:'DELETE'});loadUnits()}catch(e){alert(e.message)}}
$('unitForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const b=Object.fromEntries(f.entries());['area','price'].forEach(k=>{if(b[k]==='')delete b[k];else b[k]=Number(b[k])});try{await api('/units',{method:'POST',body:b});e.target.reset();$('unitMsg').textContent='تمت إضافة الوحدة';loadUnits()}catch(err){$('unitMsg').textContent=err.message}};
if(token)showApp();
</script></body></html>
